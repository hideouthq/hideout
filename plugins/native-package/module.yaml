product: jvm/amper-plugin

description: |
  Compiles a JVM desktop app with GraalVM native-image and packages the executable: an AppImage, DEB and RPM on Linux, and EXE and MSI on
  Windows. JAVA_HOME must point at GraalVM for the module's JDK version.

apply:
  - //common.module-template.yaml

pluginInfo:
  settingsClass: gg.hideouthq.nativepackage.NativePackageSettings

test-dependencies:
  - $libs.kotlinx.serializationJson

settings:
  jvm:
    test:
      systemProperties:
        # Tests run in the module directory.
        preview.signing: ../../core/testResources/preview/signing.json
