name: Tests

on:
  push:
    branches: ['**']
    paths-ignore: ['docs/**', '**.md']
  workflow_dispatch:

permissions: {}

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/linux-caches
      - run: ci/test.sh
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/linux-caches
        with:
          save: true
