name: Release

on:
  workflow_dispatch:
  push:
    tags: ['v*']

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  linux:
    name: AppImage, DEB and RPM
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check the tag against the version and the notes
        if: startsWith(github.ref, 'refs/tags/v')
        run: python3 tools/release/make_feed.py --check --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --notes release-notes
      - uses: ./.github/actions/linux-caches
      # Skips every part the Tests workflow already passed on this tree.
      - name: Run the tests
        run: ci/test.sh
      - name: Build the packages
        env:
          HIDEOUT_BUILD_PREVIEW_URL: ${{ secrets.HIDEOUT_BUILD_PREVIEW_URL }}
          HIDEOUT_BUILD_PREVIEW_KEY: ${{ secrets.HIDEOUT_BUILD_PREVIEW_KEY }}
          HIDEOUT_BUILD_POSTHOG_KEY: ${{ secrets.HIDEOUT_BUILD_POSTHOG_KEY }}
        run: |
          : "${HIDEOUT_BUILD_PREVIEW_URL:?the repository has no HIDEOUT_BUILD_PREVIEW_URL secret}"
          : "${HIDEOUT_BUILD_PREVIEW_KEY:?the repository has no HIDEOUT_BUILD_PREVIEW_KEY secret}"
          : "${HIDEOUT_BUILD_POSTHOG_KEY:?the repository has no HIDEOUT_BUILD_POSTHOG_KEY secret}"
          packaging/linux/build.sh
      - if: ${{ !cancelled() }}
        uses: ./.github/actions/linux-caches
        with:
          save: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux
          path: build/tasks/_desktopApp_packages@native-package/package/*
          if-no-files-found: error
          retention-days: 14

  msi:
    name: Windows EXE and MSI
    runs-on: windows-2025
    permissions:
      contents: read
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Restore the toolchain downloads
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/toolchain-downloads
          key: msi-toolchain-${{ hashFiles('.github/workflows/release.yml') }}
      - name: Restore the Kotlin and Go caches
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/AppData/Local/JetBrains
            ~/AppData/Local/go-build
            ~/go/pkg/mod
            .cache/JetBrains
          key: kotlin-windows-${{ hashFiles('kotlin.bat', 'libs.versions.toml', 'project.yaml', 'common.module-template.yaml', '**/module.yaml', '**/plugin.yaml', 'tools/link/go.sum') }}
          restore-keys: kotlin-windows-
      - name: Oracle GraalVM 25.0.4, Go 1.27.3 and WiX 3.14.1
        run: |
          $downloads = "$HOME\toolchain-downloads"
          $tools = "$env:RUNNER_TEMP\tools"
          New-Item -ItemType Directory -Force $downloads | Out-Null
          function Install-Tool($url, $sha256, $dir) {
            $file = Join-Path $downloads ([IO.Path]::GetFileName(([Uri]$url).AbsolutePath))
            if (-not (Test-Path $file)) {
              curl.exe -fsSL --retry 5 -o $file $url
              if ($LASTEXITCODE) { throw "download failed: $url" }
            }
            if ((Get-FileHash $file -Algorithm SHA256).Hash -ne $sha256) { Remove-Item $file; throw "checksum mismatch: $url" }
            New-Item -ItemType Directory -Force $dir | Out-Null
            & "$env:SystemRoot\System32\tar.exe" -xf $file -C $dir
            if ($LASTEXITCODE) { throw "could not unpack $file" }
          }
          Install-Tool https://download.oracle.com/graalvm/25/archive/graalvm-jdk-25.0.4_windows-x64_bin.zip `
            5198b29a6448cb72b9a3cef10866723e2d1e2ec4799561a344e032bb7c61e555 "$tools\graalvm"
          Install-Tool https://go.dev/dl/go1.27.3.windows-amd64.zip `
            f26081f438319757f8a1b46d7d0b2c5ec7583d4038e485e0aa725cfde7885fff $tools
          Install-Tool https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip `
            6ac824e1642d6f7277d0ed7ea09411a508f6116ba6fae0aa5f2c7daa2ff43d31 "$tools\wix"
          "JAVA_HOME=$((Get-ChildItem "$tools\graalvm" -Directory)[0].FullName)" >> $env:GITHUB_ENV
          "GOTOOLCHAIN=local" >> $env:GITHUB_ENV
          "$tools\go\bin" >> $env:GITHUB_PATH
          "$tools\wix" >> $env:GITHUB_PATH
      - name: WiX Burn 5.0.2
        run: |
          $burn = "$env:RUNNER_TEMP\tools\wix-burn"
          dotnet tool install wix --version 5.0.2 --tool-path $burn
          if ($LASTEXITCODE) { throw 'could not install WiX Burn' }
          & "$burn\wix.exe" extension add --global WixToolset.Bal.wixext/5.0.2
          if ($LASTEXITCODE) { throw 'could not install the WiX bootstrapper extension' }
          $burn >> $env:GITHUB_PATH
      - uses: ilammy/msvc-dev-cmd@0b201ec74fa43914dc39ae48a89fd1d8cb592756 # v1.13.0
      - name: Build the EXE and MSI
        env:
          HIDEOUT_BUILD_PREVIEW_URL: ${{ secrets.HIDEOUT_BUILD_PREVIEW_URL }}
          HIDEOUT_BUILD_PREVIEW_KEY: ${{ secrets.HIDEOUT_BUILD_PREVIEW_KEY }}
          HIDEOUT_BUILD_POSTHOG_KEY: ${{ secrets.HIDEOUT_BUILD_POSTHOG_KEY }}
        run: |
          if (-not $env:HIDEOUT_BUILD_PREVIEW_URL -or -not $env:HIDEOUT_BUILD_PREVIEW_KEY) { throw 'the repository has no HIDEOUT_BUILD_PREVIEW_URL or HIDEOUT_BUILD_PREVIEW_KEY secret' }
          if (-not $env:HIDEOUT_BUILD_POSTHOG_KEY) { throw 'the repository has no HIDEOUT_BUILD_POSTHOG_KEY secret' }
          ./kotlin.bat do nativePackages -m desktopApp
      - name: Check EXE installation and MSI updates
        run: plugins/native-package/test/windows-installer.ps1
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer-logs
          path: ${{ runner.temp }}/hideout-installer-check/*.log
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: msi
          path: build/tasks/_desktopApp_packages@native-package/package/*
          if-no-files-found: error
          retention-days: 14

  release:
    name: Draft release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, msi]
    runs-on: ubuntu-24.04
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: packages
          merge-multiple: true
      - name: Make the release feed and notes
        run: python3 tools/release/make_feed.py --version "${GITHUB_REF_NAME#v}" --tag "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --packages packages --notes release-notes --out feed
      - name: Sign the release feed
        env:
          RELEASE_FEED_SIGNING_KEY: ${{ secrets.RELEASE_FEED_SIGNING_KEY }}
        run: |
          : "${RELEASE_FEED_SIGNING_KEY:?the release environment has no RELEASE_FEED_SIGNING_KEY secret}"
          key=$(mktemp "$RUNNER_TEMP/release-feed-key.XXXXXX")
          trap 'rm -f "$key"' EXIT
          printf '%s\n' "$RELEASE_FEED_SIGNING_KEY" > "$key"
          tools/release/sign_feed.sh "$key" feed/releases.json
      # The feed names its files, so a name GitHub changed on upload must stop the release while it is still a draft.
      # The feed stays offline until the owner publishes: releases/latest/download skips drafts.
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mv feed/notes.md "$RUNNER_TEMP/notes.md"
          assets=(packages/*.AppImage packages/*.deb packages/*.rpm packages/*.msi packages/*-Setup.exe feed/*)
          gh release create "$GITHUB_REF_NAME" "${assets[@]}" --draft --title "Hideout $GITHUB_REF_NAME" --notes-file "$RUNNER_TEMP/notes.md" --repo "$GITHUB_REPOSITORY"
          diff <(basename -a "${assets[@]}" | sort) <(gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | sort)
